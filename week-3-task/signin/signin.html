<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <div class="row">
        <div class="col main">
            <div class="heading">
                <img src="logo.svg" alt="">
            </div>
            <div class="firstpart">
                <div class="buttons">
                    <button style="background: #EBA832 ; color: white;">Sign In</button>
                    <button style="background: #FFFFFF1A; color:#FFFFFF4D;" onclick="signup()">Sign Up</button>
                </div>
                <div class="formarea">
                    <form action="" id="signin">
                        <div>
                            <label for="" style="color: white;">Your Email</label>
                        </div>
                        <div>
                            <input type="text" placeholder="Entet Email" class="nameFeild" id="email">
                        </div>
                        <div id="emailError"></div>
                        <div>
                            <label for="" style="color: white;">Your Password</label><br>
                        </div>
                        <div>
                            <input type="text" placeholder="Enter Password" class="nameFeild" id="password">
                        </div>
                        <div id="passworderror"></div>
                    </div>
                    <div class="content row" style="color: white;position: relative;top: 86px;">
                        <div class="col">
                            <input type="checkbox">Remember Me
                        </div>
                        <div class="col">
                            <a href="">Forget Password?</a>
                        </div>
                    </div>
                </div>
                <div class="secondpart">
                    <button class="b1" type="submit">Submit</button>
                    <br>
                    <div class="line">
                        <hr style="position: relative;">
                        <p style="position: relative; bottom: 28px;">OR</p>
                    </div>
                    <br>
                    <br>
                    <button class="b2">Sign in with <img src="ic_google.svg" width="20px" height="20px" alt=""></button>
                    <div class="lasttext">
                        <span>
                            <p>Don’t have an account? <button onclick="signup()">Sign up</button></p>
                        </span>
                    </div>
                </div>
            </form>
        </div>
        <div class="col image"></div>
    </div>
    <script>
        function signup() {
        const baseUrl = window.location.origin; 
        const signupPath = "C:/Kishore/Github/Java/week-3/signup/signup.html";
        window.location.href = baseUrl + signupPath;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="signin.js"></script>
</body>

</html>
