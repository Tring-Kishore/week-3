<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <div class="row">
        <div class="col main ">
            <div class="heading">
                <img src="logo.svg" alt="">
            </div>
            <div class="firstpart">
                <div class="buttons">
                    <button style="background: #FFFFFF1A ; color: #FFFFFF4D ;" onclick="signin()">Sign In</button>
                    <button style="background: #EBA832  ; color: white ; ">Sign Up</button>
                </div>
                <div class="formarea">
                    <form action="" id="signup">
                        <div>
                            <label for="" style="color: white;">Your Name</label>
                        </div>
                        <div>
                            <input type="text" placeholder="Entet Your Name" class="nameFeild" id="name" onchange="validateName()">
                        </div>
                        <div id="namerror"></div>
                        <div>
                            <label for="" style="color: white;">Your Email</label><br>
                        </div>
                        <div>
                            <input type="email" placeholder="Enter Your Email" class="nameFeild" id="email" onchange="validateEmail()">
                        </div>
                        <div id="emailError"></div>
                        <div>
                            <label for="" style="color: white;">Languages</label>
                        </div>
                        <div>
                            <select name="language" id="language" onchange="validateLanguage()">
                                <option value="default" style="color: black;">Select the Option</option>
                                <option value="Tamil" style="color: black;">Tamil</option>
                                <option value="English" style="color: black;">English</option>
                              </select>
                        </div>
                        <div id="languageerror"></div>
                        <div>
                            <label for="" style="color: white;">Phone number</label>
                        </div>
                        <div>
                            <span>

                                <select name="country" class="dropdown-1" id="country">
                                    <option value="India" style="color: black;">India +91</option>
                                    <option value="Australia" style="color: black;">Australia +036</option>
                                    <option value="New Zealand" style="color: black;">New Zealand +554</option>
                                    <option value="USA" style="color: black;">USA +1</option>
                                  </select>
                              <input type="text" placeholder="Phone number" class="namefeild" id="phone" onchange="validatePhone()">
                                </span>
                            
                        </div>
                        <div id="phoneerror"></div>
                        <div>
                            <label for="" style="color: white;">Password</label>
                        </div>
                        <div>
                            <input type="password" placeholder="Enter Password" class="nameFeild" id="password" onchange="validatePassword()">
                        </div>
                        <div id="passworderror"></div>
                        <div style="color: white;">
                            <input type="checkbox" onchange="validateCheckbox()">Remember Me
                        </div>
                        <div id="errorcheck"></div>

                        <div style="color: white;">
                            <input type="checkbox" style="color: white;" onchange="validateCheckbox()">I agree to all the terms and Privacy Policy
                        </div>
                        <div id="errorcheck"></div>
                        <div style="color: white;">
                            <input type="radio" style="color: white;" onchange="validateCheckbox()">I'm Over 18+ 
                        </div>
                        <div id="errorcheck"></div>
                        <div class="secondpart">
                            <button class="b1" type="submit">Submit</button>
                            <br>
                            <div class="line">
                                <hr style="position: relative;"><p style="position: relative; bottom: 28px;">OR</p>
                            </div>
                            <br>
                            <br>
                            <button class="b2">Sign in with <img src="ic_google.svg" width="20px" height="20px" alt=""></button>
                            <div class="lasttext">
                                <span><p>have an account? <button onclick="signin()">Sign in</button></p></span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>            

        </div>
        <div class="col image"></div>
    </div>
    <script>
        function signin() {
    const baseUrl = window.location.origin; 
    const signupPath = "C:/Kishore/Github/Java/week-3/signin/signin.html";
    window.location.href = baseUrl + signupPath;
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        <script src="signup.js"></script>
</body>

</html>
